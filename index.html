<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Distancia AR</title>
    <!-- TailwindCSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importa Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        /* Estilos adicionales para la interfaz */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita el scroll en la vista AR */
        }
        #ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* Permite clicks a través del contenedor */
        }
        #ar-button, #reset-button {
            pointer-events: auto; /* Habilita clicks en los botones */
        }
        #distance-display {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 9999px; /* Píldora */
            font-size: 1.5rem;
            font-weight: 500;
            position: absolute;
            top: 40px;
            display: none; /* Oculto por defecto */
            transition: opacity 0.3s;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Contenedor de la interfaz de usuario -->
    <div id="ui-container">
        <!-- Botón para iniciar la sesión de AR -->
        <button id="ar-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105">
            Iniciar Medición AR
        </button>

        <!-- Muestra de la distancia -->
        <div id="distance-display">0.00 m</div>
        
        <!-- Botón para reiniciar la medición -->
        <button id="reset-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform transform hover:scale-105 absolute bottom-10" style="display: none;">
            Reiniciar
        </button>
    </div>

    <!-- Canvas para el renderizado de Three.js -->
    <canvas id="ar-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller;
        let reticle; // El indicador visual que se posa en las superficies

        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // Puntos de medición
        const points = [];
        let line = null;
        
        const distanceDisplay = document.getElementById('distance-display');
        const resetButton = document.getElementById('reset-button');
        const customArButton = document.getElementById('ar-button');

        init();

        function init() {
            // --- Configuración de la escena ---
            scene = new THREE.Scene();

            // --- Configuración de la cámara ---
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // --- Luces ---
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // --- Configuración del renderer ---
            const canvas = document.getElementById('ar-canvas');
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, canvas: canvas });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;

            // --- Botón de AR ---
            const arButton = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test'] // Requerimos la capacidad de detectar superficies
            });
            arButton.style.display = 'none'; // Ocultamos el botón por defecto de Three.js
            
            // Hacemos que nuestro botón personalizado inicie la sesión
            customArButton.addEventListener('click', () => {
                arButton.click();
            });

            // Ocultar UI inicial cuando la sesión AR comience
            renderer.xr.addEventListener('sessionstart', () => {
                customArButton.style.display = 'none';
                distanceDisplay.style.display = 'block';
                resetButton.style.display = 'block';
            });
             renderer.xr.addEventListener('sessionend', () => {
                customArButton.style.display = 'block';
                distanceDisplay.style.display = 'none';
                resetButton.style.display = 'none';
                resetMeasurement();
            });

            // --- Controlador (para manejar el input del tap) ---
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // --- Retícula (indicador de superficie) ---
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.05, 0.07, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x007bff }) // Color azul brillante
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // --- Botón de reinicio ---
            resetButton.addEventListener('click', resetMeasurement);

            // --- Iniciar el bucle de renderizado ---
            renderer.setAnimationLoop(render);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Manejo del evento de tap en la pantalla ---
        function onSelect() {
            if (reticle.visible && points.length < 2) {
                // Crear un punto visual (una pequeña esfera)
                const geometry = new THREE.SphereGeometry(0.01, 32, 32);
                const material = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Color rojo
                const pointMesh = new THREE.Mesh(geometry, material);
                
                pointMesh.position.setFromMatrixPosition(reticle.matrix);
                scene.add(pointMesh);

                points.push(pointMesh);

                if (points.length === 2) {
                    // Si tenemos dos puntos, dibujamos la línea y calculamos la distancia
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 });
                    const lineGeometry = new THREE.BufferGeometry().setFromPoints([points[0].position, points[1].position]);
                    line = new THREE.Line(lineGeometry, lineMaterial);
                    scene.add(line);

                    // Calcular y mostrar la distancia
                    const distance = points[0].position.distanceTo(points[1].position);
                    distanceDisplay.textContent = `${distance.toFixed(2)} m`;
                    distanceDisplay.style.opacity = '1';
                }
            }
        }
        
        // --- Función para reiniciar la medición ---
        function resetMeasurement() {
            // Limpiar puntos visuales
            points.forEach(point => scene.remove(point));
            points.length = 0; // Vaciar el array

            // Limpiar línea
            if (line) {
                scene.remove(line);
                line.geometry.dispose();
                line.material.dispose();
                line = null;
            }

            // Resetear el texto de la distancia
            distanceDisplay.textContent = '0.00 m';
        }

        // --- Bucle de renderizado ---
        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                            hitTestSource = source;
                        });
                    });

                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
